name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Unit Tests
        run: dotnet test BdoCronCalculator.Tests/BdoCronCalculator.Tests.csproj -c Release

      - name: Publish Windows Standalone Executable
        run: |
          dotnet publish BdoCronCalculator.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o win-publish/

      - name: Create ZIP Package and Stage Executable
        run: |
          Compress-Archive -Path win-publish/* -DestinationPath BdoCronCalculator-Windows.zip
          Copy-Item win-publish/BdoCronCalculator.exe -Destination "BdoCronCalculator.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            BdoCronCalculator.exe
            BdoCronCalculator-Windows.zip

  build-android:
    name: Build Android Mobile (.apk)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET MAUI & Android Workload
        run: dotnet workload install maui-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Build & Publish Signed Android APK
        run: |
          keytool -genkey -v -keystore bdocron.keystore -alias bdocron -keyalg RSA -keysize 2048 -validity 10000 -storepass BdoCron2026! -keypass BdoCron2026! -dname "CN=Pravix, OU=BDO Tools, O=Pravix, C=US"
          Copy-Item bdocron.keystore -Destination BdoCronCalculator.Mobile/bdocron.keystore
          dotnet publish BdoCronCalculator.Mobile/BdoCronCalculator.Mobile.csproj -f net9.0-android -c Release -p:AndroidPackageFormat=apk -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=bdocron.keystore -p:AndroidSigningKeyAlias=bdocron -p:AndroidSigningKeyPass=BdoCron2026! -p:AndroidSigningStorePass=BdoCron2026! -o android-publish/

      - name: Copy & Rename APK
        run: |
          $apk = Get-ChildItem -Path android-publish -Filter *Signed.apk -Recurse | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path android-publish -Filter *.apk -Recurse | Select-Object -First 1
          }
          Copy-Item $apk.FullName -Destination "BdoCronCalculator.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: BdoCronCalculator.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/BdoCronCalculator.exe
            release-files/BdoCronCalculator-Windows.zip
            release-files/BdoCronCalculator.apk
          generate_release_notes: true
